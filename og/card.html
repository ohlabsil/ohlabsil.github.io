<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #FFFFFF;
    color: #0A0A0A;
    font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", sans-serif;
    word-break: keep-all;
    position: relative;
  }
  .mono { font-family: "IBM Plex Mono", monospace; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 96px; border-bottom: 6px solid #0A0A0A; display: flex; align-items: center; justify-content: space-between; padding: 0 72px; font-size: 22px; }
  .credit { background: #0A0A0A; color: #FFDE59; padding: 6px 14px; }
  .frame { position: absolute; left: 72px; right: 72px; top: 96px; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; padding-bottom: 6px; }
  .logo { display: block; height: 300px; width: auto; }
  .lede { margin: 0; font-size: 60px; font-weight: 800; letter-spacing: -.035em; line-height: 1.2; }
  mark { background: #FFDE59; color: #0A0A0A; padding: 0 .15em; }
</style>
</head>
<body>
  <div class="bar mono"><span>ai research community</span><span class="credit">credit 03</span></div>
  <div class="frame">
    <img class="logo" src="../brand/logo.png" alt="">
    <div class="lede">AI의 사용자에서, <mark>저자</mark>로</div>
  </div>
</body>
</html>
